syntax = "proto3";

package inventory;

option go_package = "coffe/proto/inventory;inventorypb";

service InventoryService {
  rpc CheckStockAvailability (CheckStockRequest) returns (CheckStockResponse);
  rpc DeductStock (DeductStockRequest) returns (DeductStockResponse);
  rpc RollbackStock (RollbackStockRequest) returns (RollbackStockResponse);
  rpc ReplenishStock (ReplenishStockRequest) returns (ReplenishStockResponse);
}

message ReplenishItemPayload {
  string ingredient_id = 1;
  double quantity = 2;
  double unit_cost = 3;
}

message ReplenishStockRequest {
  string purchase_id = 1;
  repeated ReplenishItemPayload items = 2;
}

message ReplenishStockResponse {
  bool success = 1;
  string message = 2;
}

message OrderItemPayload {
  int64 menu_id = 1;
  int32 quantity = 2;
}

message CheckStockRequest {
  repeated OrderItemPayload items = 1;
}

message UnavailableItem {
  int64 menu_id = 1;
  string ingredient_name = 2;
  double stock_available = 3;
  double stock_needed = 4;
}

message CheckStockResponse {
  bool is_available = 1;
  repeated UnavailableItem missing_items = 2;
}

message DeductStockRequest {
  string transaction_id = 1;
  repeated OrderItemPayload items = 2;
}

message DeductStockResponse {
  bool success = 1;
  string message = 2;
}

message RollbackStockRequest {
  string transaction_id = 1;
  repeated OrderItemPayload items = 2;
}

message RollbackStockResponse {
  bool success = 1;
  string message = 2;
}

