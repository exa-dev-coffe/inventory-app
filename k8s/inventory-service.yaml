# 1. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-coffe
  namespace: coffe
spec:
  selector:
    matchLabels:
      app: inventory-service-coffe
  template:
    metadata:
      labels:
        app: inventory-service-coffe
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: inventory-service-coffe
          image: ghcr.io/exa-dev-coffe/inventory-service-coffe:latest
          ports:
            - name: http
              containerPort: 8086
            - name: grpc
              containerPort: 9086
          startupProbe:
            httpGet:
              path: /health
              port: 8086
            failureThreshold: 5
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - secretRef:
                name: inventory-env

---
# 2. Service Backend Pods (Targeted by KEDA Interceptor after pod spins up)
apiVersion: v1
kind: Service
metadata:
  name: inventory-service-coffe-backend
  namespace: coffe
spec:
  selector:
    app: inventory-service-coffe
  ports:
    - name: http
      protocol: TCP
      port: 8086
      targetPort: 8086
    - name: grpc
      protocol: TCP
      port: 9086
      targetPort: 9086
  type: ClusterIP

---
# 3. Service DNS Shim (Intercepts internal DNS calls from Kong/services to KEDA Interceptor)
apiVersion: v1
kind: Service
metadata:
  name: inventory-service-coffe
  namespace: coffe
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
# 4. KEDA Zero-Scaling (Scale to 0 when idle)
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: inventory-service-coffe-http
  namespace: coffe
spec:
  scaleTargetRef:
    name: inventory-service-coffe
    kind: Deployment
    apiVersion: apps/v1
    service: inventory-service-coffe-backend
    port: 8086
  replicas:
    min: 0
    max: 3
  hosts:
    - inventory-service-coffe.eka-dev.cloud
    - inventory-service-coffe.coffe.svc.cluster.local
    - inventory-service-coffe.coffe.svc.cluster.local:8080
    - inventory-service-coffe.coffe.svc.cluster.local:8086
    - inventory-service-coffe.coffe
    - inventory-service-coffe.coffe:8080
    - inventory-service-coffe.coffe:8086
    - inventory-service-coffe
    - inventory-service-coffe:8080
    - inventory-service-coffe:8086
  scalingMetric:
    concurrency:
      targetValue: 30
  scaledownPeriod: 300 # 5 minutes idle cooldown before scaling to 0

---
# 5. Ingress (Directs incoming ingress traffic through KEDA Interceptor)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-service-coffe
  namespace: coffe
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - inventory-service-coffe.eka-dev.cloud
      secretName: inventory-tls
  rules:
    - host: inventory-service-coffe.eka-dev.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keda-http-proxy
                port:
                  number: 8080
