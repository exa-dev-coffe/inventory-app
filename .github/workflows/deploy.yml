name: Build & Deploy Inventory Service to VPS via GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc & Dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config

      - name: Run Tests
        run: cargo test --verbose

  build-and-deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup git identity
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"

      - name: Bump version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          CURRENT=$(cat VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BUMP="patch"

          # Get PR number from merge commit
          PR_NUMBER=$(git log -1 --pretty=%B | grep -oE '#([0-9]+)' | tr -d '#' || true)

          if [ -n "$PR_NUMBER" ]; then
            echo "🔍 Checking PR #$PR_NUMBER comments..."

            COMMENTS=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/$PR_NUMBER/comments")

            if echo "$COMMENTS" | grep -qi "/version major"; then
              BUMP="major"
            elif echo "$COMMENTS" | grep -qi "/version minor"; then
              BUMP="minor"
            elif echo "$COMMENTS" | grep -qi "/version patch"; then
              BUMP="patch"
            fi
          else
            echo "ℹ️ No PR detected, default patch"
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR+1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH+1)) ;;
          esac

          NEXT="$MAJOR.$MINOR.$PATCH"

          echo "🔖 Version bump ($BUMP): v$CURRENT → v$NEXT"

          echo "$NEXT" > VERSION
          echo "VERSION=$NEXT" > version.env

          git add VERSION
          git commit -m "chore(version): bump to v$NEXT [skip ci]" || true
          git push origin main || true

          cat version.env

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.env

      - name: Get Commit SHA (short)
        id: vars
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Image With SHA Tag
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/inventory-service-coffe:${{ steps.vars.outputs.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/inventory-service-coffe:latest .

      - name: Push Image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/inventory-service-coffe:${{ steps.vars.outputs.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/inventory-service-coffe:latest

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 31080 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          # Apply base deployment and service to k8s cluster via SSH
          ssh -p 31080 -i ~/.ssh/id_ed25519 deploy@${{ secrets.VPS_HOST }} \
            "export KUBECONFIG=/home/deploy/.kube/config; kubectl apply -f -" < k8s/inventory-service.yaml

          # Patch image and check rollout
          ssh -p 31080 -i ~/.ssh/id_ed25519 deploy@${{ secrets.VPS_HOST }} << EOF
            export KUBECONFIG=/home/deploy/.kube/config

            kubectl set image deployment/inventory-service-coffe -n coffe \
              inventory-service-coffe=ghcr.io/${{ github.repository_owner }}/inventory-service-coffe:${{ steps.vars.outputs.sha }}

            kubectl rollout status deployment/inventory-service-coffe -n coffe --timeout=180s || true
          EOF
